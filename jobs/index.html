<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><title>Rally Point Jobs</title>
<style>
/* the doorway (build 28): the look is the Jobs page's own - its colours, type, top strip, band, box and button, copied from Jobs.html */
:root{--navy:#13294b;--yel:#faf050;--ink:#1f2937;--mute:#4a5159;--line:#e3e7ee;--soft:#f3f5f9;--warn:#b45309;--warnbg:#fff3d6}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:16px/1.45 Arial,sans-serif}
.top{display:flex;align-items:center;min-height:52px;background:var(--navy);color:#fff;padding:4px max(10px,calc(50% - 410px))}
.top b{padding:8px 6px;font-size:17px}
.top i{display:inline-block;width:12px;height:12px;margin-right:8px;border-radius:50%;background:var(--yel);vertical-align:-1px}
.wrap{max-width:820px;margin:0 auto;padding:4px 16px 24px}
h2{font-size:22px;color:var(--navy);margin:16px 0 4px}
p{margin:8px 0}
.q{color:var(--mute);font-size:14px}
.step{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.step i{flex:0 0 28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;font-style:normal;font-weight:bold;text-align:center;line-height:28px}
.step b{display:block}
.band{background:var(--warnbg);border-left:4px solid var(--warn);padding:12px 14px;margin:16px 0 10px;font-weight:bold}
.band span{display:block;font-weight:normal;margin-top:2px}
button{display:block;width:100%;min-height:48px;margin:8px 0;padding:11px 16px;font:bold 16px Arial,sans-serif;text-align:left;color:var(--navy);background:#fff;border:1px solid var(--navy);border-radius:8px;cursor:pointer}
button.go{background:var(--navy);color:#fff}
.cam{display:block;width:100%;max-height:50vh;margin:10px 0;border-radius:8px;background:#000}
.in{display:block;width:100%;min-height:52px;margin:10px 0;padding:12px 14px;font:16px Arial,sans-serif;color:var(--ink);background:#eef3fb;border:1px solid var(--navy);border-radius:8px}
</style></head>
<body>
<div class="top"><b><i></i>Rally Point Jobs</b></div>
<div class="wrap" id="w"><p class="q" id="s">Opening - one moment.</p></div>
<script>
var DOOR = 'https://script.google.com/macros/s/AKfycbyy3S64Z3nbJ3wonF1pw6maFz9FXZX1jo77xgyIOHdxL9P2cwiup0ReADAw59vPUY_J/exec', P = 'rpt_';
var NONE = 'This device has not been let in yet - scan the key at the desk', OFF = 'This device was turned off at the desk', USED = 'That key is used up - ask for a new one at the desk';
function get(k) { try { return localStorage.getItem(P + k); } catch (e) { return null; } }
function put(k, v) { try { localStorage.setItem(P + k, v); } catch (e) {} }
var q = new URLSearchParams(location.search), key = q.get('e'), tok = get('tok') || '', c = null, W = document.getElementById('w');
var TOUCH = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches), IT = TOUCH ? 'phone' : 'computer';
// can this browser read a square by itself? (Chrome on Android can; where it cannot, the phone's own camera app does the same job)
var CAN = !!(window.BarcodeDetector && navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
// the one-use key leaves the address bar at once: a bookmark or a shared link never carries it
if (key) try { history.replaceState(null, '', location.pathname); } catch (e) {}
try { c = JSON.parse(get('page') || 'null'); } catch (e) {}
function show(html, from) { window.RP_FROM = from; document.open(); document.write(html); document.close(); }
function band(a, b) { return '<div class="band">' + a + '<span>' + b + '</span></div>'; }
function say(m) { W.innerHTML = '<p class="q">' + m + '</p>'; }
/** A device that is not let in: what to do, and above it the reason it was refused, if it was. Nothing of the sheet is on this screen. */
function steps(why) {
  W.innerHTML = (why || '') + '<h2>Scan the key</h2><p>This ' + IT + ' has not been let in yet.</p>' +
    '<div class="step"><i>1</i><div><b>At the desk computer</b>open the sheet Rally Point Stock.</div></div>' +
    '<div class="step"><i>2</i><div><b>Menu Rally Point</b>then Open the Jobs page.</div></div>' +
    (!TOUCH ? '<div class="step"><i>3</i><div><b>Click the blue button</b>Open the Jobs page on this computer.</div></div>'
      : CAN ? '<div class="step"><i>3</i><div><b>Tap Scan the Key</b>below, and point this phone at the square.</div></div>'
      : '<div class="step"><i>3</i><div><b>Point this phone\'s camera</b>at the square, and tap the link it shows.</div></div>') +
    (TOUCH && CAN ? '<button class="go" id="sc">Scan the Key</button>' : '') +
    '<p class="q">Once only. After that this ' + IT + ' opens the page by itself.</p>';
  if (TOUCH && CAN) document.getElementById('sc').onclick = scan;
}
/** What the camera read: only a square made for THIS page counts (this address, with a key in it). Anything else is not a key, and scanning goes on. */
function got(text) {
  var m = /^([^?#]+)\?(?:.*&)?e=([0-9a-f]{6,64})(?:[&#]|$)/.exec(String(text || ''));
  if (!m || m[1] !== location.origin + location.pathname) return false;
  key = m[2]; shut(); ask();
  return true;
}
var CAM = null, TICK = 0;
function shut() { clearInterval(TICK); TICK = 0; try { if (CAM) CAM.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {} CAM = null; }
/** Scan the Key: this phone's own camera, on this screen. Nothing is sent anywhere until a key is read. A phone that cannot do this never sees the button. */
function scan() {
  W.innerHTML = '<h2>Scan the key</h2><p class="q" id="cs">Starting the camera - one moment.</p><video class="cam" id="cv" playsinline muted></video><button id="cx">Stop</button>';
  document.getElementById('cx').onclick = function () { shut(); steps(''); };
  navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment'}}).then(function (st) {
    var v = document.getElementById('cv'), det = new BarcodeDetector({formats: ['qr_code']}), busy = false;
    if (!v) return st.getTracks().forEach(function (t) { t.stop(); });   // she tapped Stop while the camera was opening
    CAM = st; v.srcObject = st; v.play();
    document.getElementById('cs').textContent = 'Point this phone at the square on the desk computer.';
    TICK = setInterval(function () {
      if (busy || !CAM) return;
      busy = true;
      det.detect(v).then(function (r) { busy = false; for (var i = 0; i < r.length; i++) if (got(r[i].rawValue)) return; }, function () { busy = false; });
    }, 250);
  }, function () { shut(); steps(band('The camera did not open', 'Allow the camera for this page, or use this phone\'s own camera app: point it at the square and tap the link.')); });
}
function refused(m) {
  if (m === OFF) return steps(band('This ' + IT + ' was turned off', 'It was taken off the list at the desk. To use it again, scan a new key.'));
  if (m === USED) return steps(band('That key is used up', 'A key works once, for 10 minutes. Ask for a new one at the desk computer.'));
  if (m === NONE) { put('page', ''); return steps(''); }   // the token is kept: if this device is put back on the list it works again
  say(m + '.');
}
function post(body, ok, again) {
  fetch(DOOR, {method: 'POST', body: JSON.stringify(body)}).then(function (r) { return r.json(); }).then(function (r) { if (r.ok) ok(r.value); else refused(r.error); },
    function () { W.innerHTML = '<p>No signal, or the sheet could not be reached. Nothing is lost.</p><button class="go" id="ag">Try Again</button>'; document.getElementById('ag').onclick = again; });
}
/** This device has a key in hand: its owner says whose it is (or skips - it then names itself), and it is let in. */
function ask() {
  W.innerHTML = '<h2>Whose ' + IT + ' is this?</h2><p class="q">So the list at the desk can tell the devices apart. Like: Jenna\'s phone.</p>' +
    '<input class="in" id="n" maxlength="40" autocomplete="off" placeholder="Type a name">' +
    '<button class="go" id="ok">Let This ' + (TOUCH ? 'Phone' : 'Computer') + ' In</button><button id="sk">Skip</button>';
  document.getElementById('ok').onclick = function () { enrol(document.getElementById('n').value); };
  document.getElementById('sk').onclick = function () { enrol(''); };
  document.getElementById('n').onkeydown = function (e) { if (e.key === 'Enter') enrol(this.value); };
}
function enrol(name) {
  say('Letting this ' + IT + ' in - one moment.');
  post({fn: 'enrol', e: key, name: name, ua: navigator.userAgent}, function (v) { tok = v.t; put('tok', tok); put('page', ''); c = null; key = null; open(); }, function () { enrol(name); });
}
function open() {
  // the kept copy is used only when it is a page that knows it was kept (it then checks the sheet again by itself), and only one this doorway's own kind (v: 1)
  if (c && c.v === 1 && c.html && c.html.indexOf('RP_FROM') > 0 && !q.get('fresh')) return show(c.html, 'cache');
  say('Opening - one moment.');
  fetch(DOOR + '?fn=page&t=' + encodeURIComponent(tok)).then(function (r) { return r.json(); }).then(function (r) {
    if (!r.ok) return refused(r.error);
    put('page', JSON.stringify({v: 1, html: r.html}));
    show(r.html, 'door');
  }, function () { W.innerHTML = '<p>No signal, or the page could not be reached. Check the wifi.</p><button class="go" id="ag">Try Again</button>'; document.getElementById('ag').onclick = open; });
}
if (key) ask(); else if (tok) open(); else steps('');
</script>
</body></html>
